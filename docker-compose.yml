services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kegpass}
      POSTGRES_DB: ${POSTGRES_DB:-kegdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 数据库不发布到宿主端口，仅在 compose 内部网络访问
    networks:
      - internal

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-keg}:${POSTGRES_PASSWORD:-kegpass}@db:5432/${POSTGRES_DB:-kegdb}?sslmode=disable
      PORT: "8080"
      STATIC_DIR: /app/static
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
